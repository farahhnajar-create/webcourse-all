<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webcourse</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <nav>
        <h1 class="name">Activity</h1>
        <input class="search" placeholder="Search">
        <button class="login" onclick="changeInnerText(this)">Login</button>
    </nav>
    <div class="container">
        <div class="left-side">
            <div class="box">
                <div class="info">
                    <h2>Welcome</h2>
                    <em>noun</em>
                    <p>plural: <em>Engineers</em></p>
                    <button class="likes" onclick="showAlert(); changePadding(this)">13 likes</button>
                </div>
                <div class="description">
                    <p>A practitoner skilled in the 
                        <a href="">Japanese</a> art of <a href="">ninjutsu</a>
                    </p>
                </div>
            </div>
            <div class="box">
                <div class="info">
                    <h2>Engineer</h2>
                    <em>noun</em>
                    <p>plural: <em>Engineers</em></p>
                    <button class="likes" onclick="showAlert(); changeBorder(this)">37 likes</button>
                </div>
                <div class="description">
                    <p>A programmer who break down problems with
                        <a href="">Zen</a>-like foucus
                    </p>
                </div>
            </div>
        </div>
        <div class="right-side">
            <div class="right-box">
                <h3>JavaScript is defined by <span>YOU</span></h3>
                <button class="definition" onclick="remove(this)" >Add Definition</button>
            </div>
        </div>
    </div>
    <div class="user-box">
        <div class="user-info">
            <h3>Some User</h3> 
            <p><span id="likes">3</span>like(s)</p>
            <button onclick="addLike(this)">Like</button>
        </div>
        <p class="user-body">This is some filer text, it can say anything we like </p>
    </div>
</body>
</html>
